name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # the blank-line rules are preview-only in ruff, so they need their own pass
      - run: ruff check --preview --select E301,E302,E303,E305,E306 .
      - run: mypy mahad
      - run: python -m pytest -q
      # The suite is Qt-free, so Ubuntu needs no GL libraries; the window boot runs on Windows only.
      - if: runner.os == 'Windows'
        run: python -m mahad --smoke
        env:
          QT_QPA_PLATFORM: offscreen
